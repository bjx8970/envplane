name: Strict control-plane tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control-plane:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: control_plane_test_ci
        ports:
          - "127.0.0.1::5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d control_plane_test_ci"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install minimal control-plane dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          sqlalchemy==2.0.49 pg8000==1.31.5 alembic==1.17.2
          jsonschema==4.25.1 PyYAML==6.0.3 cryptography==48.0.0 paramiko==5.0.0
          starlette==0.52.1 uvicorn==0.41.0 websockets==16.0 httpx==0.28.1
      - name: Run all new control-plane tests without skips
        env:
          CONTROL_PLANE_TEST_DATABASE_URL: postgresql+pg8000://postgres:disposable-ci-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/control_plane_test_ci
          CONTROL_PLANE_REQUIRE_TEST_DATABASE: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B scripts/run_ci_tests.py
