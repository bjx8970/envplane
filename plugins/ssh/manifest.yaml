{
  "manifest_version": 1,
  "api_version": "1",
  "plugin_key": "ssh",
  "plugin_version": "1.0.0",
  "display_name": "SSH management commands",
  "entrypoint": "plugin:SSHPlugin",
  "actions": {
    "list_host_options": {
      "display_name": "List configured hosts",
      "input_schema": {"type": "object", "additionalProperties": false, "properties": {}},
      "output_schema": {
        "type": "array", "maxItems": 1000,
        "items": {
          "type": "object", "additionalProperties": false,
          "properties": {"id": {"type": "string", "minLength": 1, "maxLength": 240}, "name": {"type": "string", "minLength": 1, "maxLength": 255}},
          "required": ["id", "name"]
        }
      },
      "execution": {"effect": "read_only", "idempotency": "unsupported", "recovery": "unsupported", "cancellation": "unsupported"}
    },
    "execute_command": {
      "display_name": "Execute administrator template command",
      "template_fixed_inputs": ["command"],
      "input_schema": {
        "type": "object", "additionalProperties": false,
        "properties": {"host_id": {"type": "string", "minLength": 1, "maxLength": 240, "pattern": "^[^/]+$"}, "command": {"type": "string", "minLength": 1, "maxLength": 65536},
          "include_target_fingerprint": {"type": "boolean"},
          "expected_target_fingerprint": {"type": "string", "pattern": "^[a-f0-9]{64}$"}},
        "required": ["host_id", "command"]
      },
      "output_schema": {
        "type": "object", "additionalProperties": false,
        "properties": {"exit_code": {"type": "integer"}, "stdout": {"type": "string", "maxLength": 1048576}, "stderr": {"type": "string", "maxLength": 1048576},
          "target_fingerprint": {"type": "string", "pattern": "^[a-f0-9]{64}$"}},
        "required": ["exit_code", "stdout", "stderr"]
      },
      "execution": {"effect": "mutating", "idempotency": "unsupported", "recovery": "unsupported", "cancellation": "unsupported"}
    }
  },
  "sessions": {}
}
